# Migration Example: Gradual Transition from Old to New
# This workflow shows how to gradually migrate from traditional transformers
# to the new pipeline-based approach while maintaining compatibility

id: gradual_migration_workflow
name: Hybrid ETL - Migration Example
version: 1.0.0
description: |
  Demonstrates gradual migration strategy where old and new approaches
  coexist. Teams can migrate step-by-step without breaking existing flows.

parameters:
  - name: source_file_id
    type: string
    required: true

  - name: enable_new_features
    type: boolean
    default: false
    description: Toggle to enable new pipeline features

routes:
  # Main route that mixes old and new approaches
  - id: hybrid_route
    name: Hybrid Processing
    actions:
      # ========================================
      # PHASE 1: Use traditional transformer
      # (No changes needed - works as before)
      # ========================================

      - type: Transform
        transformer: csv_parse
        config:
          source_file_id: "${input.source_file_id}"
          delimiter: ","
          has_header: true

      # ========================================
      # PHASE 2: Add new pipeline stage for dedup
      # (New capability, optional activation)
      # ========================================

      - type: Transform
        transformer: pipeline_adapter
        config:
          # Inline pipeline for specific operation
          pipeline:
            type: inline
            name: dedup_stage

          # Only deduplicate if feature enabled
          skip_if: "${input.enable_new_features} != true"

          stages:
            - id: dedupe
              type: differential_dedupe
              config:
                key_fields: [customer_id, email]
                window_size_ms: 3600000
                use_bloom_filter: true

      # ========================================
      # PHASE 3: Traditional field mapping
      # (Unchanged, but can read pipeline output)
      # ========================================

      - type: Transform
        transformer: field_mapper
        config:
          dataset_type: customer
          # Works with both traditional and pipeline output
          input_format: "${data.format || 'json'}"

      # ========================================
      # PHASE 4: Quality checks with fallback
      # ========================================

      - type: Transform
        transformer: quality_checker_adaptive
        config:
          # Try new quality engine first
          primary_engine: pipeline_quality
          # Fall back to traditional if unavailable
          fallback_engine: traditional_quality

          rules:
            - completeness: [email, name, created_date]
            - validity: email_format
            - consistency: date_logic

      # ========================================
      # PHASE 5: Conditional advanced processing
      # ========================================

      - type: Transform
        transformer: conditional_pipeline
        config:
          condition: "${data.quality_score} > 0.8 && ${input.enable_new_features}"

          # Only run ML predictions on high-quality data
          if_true:
            pipeline: ml_enhancement
            stages:
              - type: model_predictor
                models:
                  - gender_predictor_v2
                  - churn_risk_v3

          # Skip ML for low-quality data
          if_false:
            action: skip
            log_message: "Skipping ML due to low quality score"

      # ========================================
      # PHASE 6: Smart destination routing
      # ========================================

      - type: Transform
        transformer: smart_destination_router
        config:
          # Route based on capabilities
          routing_logic:
            # Use new multi-destination if available
            - condition: "${features.multi_destination_enabled}"
              destination:
                type: pipeline_adapter
                pipeline: multi_sink
                targets: [db2, rdf, kafka]

            # Otherwise use traditional single destination
            - condition: "true"  # Default
              destination:
                type: db2_load
                table: customers
                mode: append

      # ========================================
      # PHASE 7: Lineage (works with both)
      # ========================================

      - type: RecordLineage
        event_type: "hybrid_etl"
        metadata:
          traditional_steps: "${data.traditional_step_count || 0}"
          pipeline_steps: "${data.pipeline_step_count || 0}"
          quality_score: "${data.quality_score}"
          ml_enhanced: "${data.ml_predictions != null}"

# Feature flags for gradual rollout
feature_flags:
  multi_destination_enabled:
    description: Enable multi-destination writes
    default: false
    rollout_percentage: 10  # Start with 10% of workflows

  differential_dataflow_enabled:
    description: Use Differential Dataflow for deduplication
    default: false
    rollout_percentage: 25

  ml_predictions_enabled:
    description: Enable ML model predictions
    default: true
    rollout_percentage: 50

# A/B testing configuration
ab_testing:
  enabled: true
  variants:
    - name: control
      weight: 50
      config:
        use_traditional: true
        enable_new_features: false

    - name: treatment
      weight: 50
      config:
        use_traditional: false
        enable_new_features: true

  metrics:
    - execution_time_ms
    - quality_score
    - records_processed
    - error_rate

# Monitoring and alerting
monitoring:
  comparison_mode: true  # Compare old vs new performance

  alerts:
    - metric: execution_time_ms
      condition: "new_time > old_time * 1.1"  # Alert if new is 10% slower
      message: "Performance regression detected in new pipeline"

    - metric: quality_score
      condition: "abs(new_score - old_score) > 0.05"
      message: "Quality score difference detected between implementations"

# Rollback configuration
rollback:
  automatic: true
  conditions:
    - error_rate > 0.05  # More than 5% errors
    - execution_time_ms > baseline_ms * 2  # 2x slower

  action:
    type: revert_to_traditional
    notify: ["data-ops@example.com"]
    log_level: warn