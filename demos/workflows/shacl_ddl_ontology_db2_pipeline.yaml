apiVersion: graphica.io/v1
kind: Workflow
metadata:
  name: shacl-ddl-ontology-db2-pipeline
  version: 1.0.0
  description: |
    Complete ontology-driven data pipeline with SHACL-based DDL generation.
    This workflow demonstrates the File Library First architecture with
    schema-first development approach:
    1. Load CSV from File Library
    2. Parse CSV to structured records
    3. Map to ontological fields
    4. Query SHACL shapes from RDF store
    5. Generate DB2 DDL from SHACL constraints
    6. Load data to DB2 with auto-generated schema
  owner: data-governance-team
  tags:
    - ontology
    - shacl
    - ddl-generation
    - schema-first
    - db2
    - production

spec:
  execution:
    mode: streaming
    timeout: 600  # 10 minutes for full pipeline
    retries: 3
    parallelism: 4

  # Default route handles all data through the complete pipeline
  default_route: ontology_pipeline

  routes:
    # Main ontology-driven pipeline
    - name: ontology_pipeline
      priority: 100
      condition:
        Always: true

      actions:
        # ============================================================
        # PHASE 1: CSV Parsing from File Library
        # ============================================================
        - type: Transform
          transformer: csv_parse
          config:
            # file_id should be provided in input data
            # Example: {"file_id": "file_abc123"}
            delimiter: ","
            has_header: true
            skip_empty_lines: true
            trim_fields: true
            max_rows: 1000000  # Safety limit

        - type: Log
          level: info
          message: "Phase 1 complete: CSV parsed from file library"

        # ============================================================
        # PHASE 2: Ontology Mapping (source → semantic fields)
        # ============================================================
        - type: Transform
          transformer: ontology_map
          config:
            # Maps source CSV fields to ontological field names
            # Example: "customer_email" → "schema:email"
            # Example: "cust_id" → "schema:identifier"
            namespace: "http://schema.org/"
            strict_mode: false  # Allow unmapped fields to pass through
            add_provenance: true

        - type: Log
          level: info
          message: "Phase 2 complete: Fields mapped to ontology"

        # ============================================================
        # PHASE 3: SHACL-DDL Generation (NEW!)
        # ============================================================
        - type: Transform
          transformer: shacl_ddl_generator
          config:
            # SQL dialect for DDL generation
            dialect: "db2"

            # Generate indexes for unique constraints
            include_indexes: true

            # Generate foreign key constraints
            include_foreign_keys: true

            # SHACL shape URI should be in data or derived from ontology mapping
            # Example: shape_uri = "http://example.com/shape/Customer"
            # If not provided, will use first shape matching the ontology class

        - type: Log
          level: info
          message: "Phase 3 complete: DDL generated from SHACL shapes"

        # ============================================================
        # PHASE 4: DB2 Data Loading with Generated DDL
        # ============================================================
        - type: Transform
          transformer: db2_load
          config:
            # Connection details (from environment)
            host: "${DB2_HOST}"
            port: 50000
            database: "GRAPHICA"
            user: "${DB2_USER}"
            password: "${DB2_PASSWORD}"

            # Use DDL from previous step (shacl_ddl_generator output)
            use_generated_ddl: true

            # Table creation mode
            create_table: true  # Create table if it doesn't exist
            truncate_before_load: false  # Preserve existing data

            # Loading strategy
            mode: "merge"  # Options: insert, merge, upsert
            batch_size: 1000
            commit_interval: 5000

            # Error handling
            on_error: "continue"  # Options: abort, continue, skip_row
            dead_letter_queue: true
            dlq_table: "ETL_ERRORS"

        - type: Log
          level: info
          message: "Phase 4 complete: Data loaded to DB2"

        # ============================================================
        # PHASE 5: Lineage and Observability
        # ============================================================
        - type: RecordLineage
          event_type: "ontology_etl_complete"
          metadata:
            pipeline: "shacl_ddl_ontology_db2"
            phases:
              - "csv_parse"
              - "ontology_map"
              - "shacl_ddl_generate"
              - "db2_load"

        - type: IncrementMetric
          metric: "graphica_pipeline_executions_total"
          labels:
            pipeline: "shacl_ddl_ontology_db2"
            status: "success"

        - type: Log
          level: info
          message: "✅ Complete pipeline executed successfully"

    # ============================================================
    # ERROR HANDLING ROUTE
    # ============================================================
    - name: error_handler
      priority: 0
      condition:
        Field:
          field: error
          operator: Exists
          value: null

      actions:
        - type: Log
          level: error
          message: "Pipeline error occurred"

        - type: RecordLineage
          event_type: "ontology_etl_error"
          metadata:
            pipeline: "shacl_ddl_ontology_db2"

        - type: IncrementMetric
          metric: "graphica_pipeline_executions_total"
          labels:
            pipeline: "shacl_ddl_ontology_db2"
            status: "error"

        - type: Notify
          channel: "slack"
          recipient: "#data-alerts"
          message: "SHACL-DDL pipeline failed"

  # ============================================================
  # MONITORING AND SLA
  # ============================================================
  monitoring:
    enabled: true
    quality_threshold: 0.98  # 98% success rate required

    sla:
      # End-to-end latency (all phases)
      latency_p99_ms: 5000  # 5 seconds for P99
      latency_p50_ms: 2000  # 2 seconds for P50

      # Throughput target
      throughput_per_sec: 1000  # 1K records/sec

    alerts:
      - name: high_error_rate
        condition: error_rate > 0.05  # > 5% errors
        severity: critical
        channels:
          - slack
          - email

      - name: slow_pipeline
        condition: latency_p99 > 10000  # > 10 seconds
        severity: warning
        channels:
          - slack

  # ============================================================
  # RETRY AND RECOVERY
  # ============================================================
  retry:
    max_attempts: 3
    backoff:
      initial_delay_ms: 1000
      max_delay_ms: 30000
      multiplier: 2.0

    retryable_errors:
      - "TransientDatabaseError"
      - "NetworkTimeout"
      - "ConnectionRefused"

  # ============================================================
  # RESOURCE LIMITS
  # ============================================================
  resources:
    memory_mb: 2048
    cpu_cores: 4
    max_concurrent_executions: 10
