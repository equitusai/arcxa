# Example Workflow: DDL Execution with Approval Gate
#
# This workflow demonstrates the approval workflow feature for DDL operations.
#
# Flow:
# 1. Parse CSV with SHACL ontology to determine table schema
# 2. Generate DDL statements (CREATE TABLE)
# 3. **PAUSE** for human approval of DDL changes
# 4. After approval, execute DDL on DB2
# 5. Load data into the created table
#
# Use Case: Production database schema changes require approval before execution

id: ddl_approval_workflow
name: "DDL Execution with Approval Gate"
description: "Generates DDL from ontology, pauses for approval, then executes on DB2"
version: 1

routes:
  - id: main_route
    name: "Main Approval Flow"
    description: "Parse → Generate DDL → Approve → Execute"
    enabled: true
    priority: 1

    actions:
      # Step 1: Log workflow start
      - log:
          message: "Starting DDL workflow with approval gate"
          level: "info"

      # Step 2: Parse CSV and generate DDL from SHACL ontology
      - transform:
          transformer: "shacl_ddl"
          config:
            source_file_id: "${input.source_file_id}"
            ontology_file_id: "${input.ontology_file_id}"
            target_schema: "${input.target_schema}"
            target_table: "${input.target_table}"
            dialect: "db2"
            # Output: generated_ddl, column_mappings

      # Step 3: Log generated DDL for auditing
      - log:
          message: "Generated DDL: ${data.generated_ddl}"
          level: "info"

      # Step 4: APPROVAL GATE - Pause workflow for human review
      # This is the key integration point for the approval feature
      - wait_for_approval:
          approval_id: "ddl_execution_approval"
          approval_type: "ddl_execution"
          approval_payload:
            operation: "CREATE_TABLE"
            target_schema: "${input.target_schema}"
            target_table: "${input.target_table}"
            ddl_statement: "${data.generated_ddl}"
            impact_level: "high"
            requester: "${input.requester_email}"
          timeout_secs: 86400  # 24 hours - expires if not approved

      # Workflow PAUSED here until approval is granted via API:
      # POST /api/v1/workflows/approvals/{request_id}/approve
      # Body: { "approved_by": "admin@example.com" }

      # Step 5: Log approval (only reached after approval)
      - log:
          message: "DDL approved, executing on DB2"
          level: "info"

      # Step 6: Execute approved DDL on DB2
      - transform:
          transformer: "db2_load"
          config:
            connection:
              host: "${env.DB2_HOST}"
              port: "${env.DB2_PORT}"
              database: "${env.DB2_DATABASE}"
              username: "${env.DB2_USERNAME}"
              password: "${env.DB2_PASSWORD}"
            ddl_statements:
              - "${data.generated_ddl}"
            dry_run: false  # Actually execute (not just validate)

      # Step 7: Load data into newly created table
      - transform:
          transformer: "db2_load"
          config:
            source_file_id: "${input.source_file_id}"
            target_schema: "${input.target_schema}"
            target_table: "${input.target_table}"
            connection:
              host: "${env.DB2_HOST}"
              port: "${env.DB2_PORT}"
              database: "${env.DB2_DATABASE}"
              username: "${env.DB2_USERNAME}"
              password: "${env.DB2_PASSWORD}"
            mode: "INSERT"
            batch_size: 1000

      # Step 8: Record lineage
      - record_lineage:
          source_id: "${input.source_file_id}"
          target_id: "${input.target_schema}.${input.target_table}"
          transformation: "ddl_and_load"
          metadata:
            approved_by: "${approval.approved_by}"
            approval_timestamp: "${approval.approved_at}"
            ddl_executed: "${data.generated_ddl}"

      # Step 9: Success notification
      - notify:
          channel: "workflow_events"
          message: "DDL execution completed successfully for ${input.target_table}"
          metadata:
            workflow_id: "${workflow.id}"
            execution_id: "${execution.id}"
            approved_by: "${approval.approved_by}"

# Example input parameters when triggering workflow:
#
# POST /api/v1/workflows/ddl_approval_workflow/execute
# {
#   "input": {
#     "source_file_id": "file_abc123",
#     "ontology_file_id": "file_ontology_456",
#     "target_schema": "PROD_SCHEMA",
#     "target_table": "CUSTOMERS",
#     "requester_email": "data-eng@company.com"
#   }
# }
#
# Workflow will pause at step 4 (wait_for_approval action)
# Admin receives notification and reviews approval request via API:
#
# GET /api/v1/workflows/approvals?workflow_id=ddl_approval_workflow&status=pending
#
# Admin approves:
# POST /api/v1/workflows/approvals/{request_id}/approve
# { "approved_by": "dba-admin@company.com" }
#
# Workflow automatically resumes from checkpoint and continues to step 5
