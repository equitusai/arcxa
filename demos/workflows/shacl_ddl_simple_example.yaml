apiVersion: graphica.io/v1
kind: Workflow
metadata:
  name: shacl-ddl-simple-example
  version: 1.0.0
  description: Simple SHACL-DDL generation example for testing
  owner: dev-team
  tags:
    - shacl
    - ddl
    - example
    - development

spec:
  execution:
    mode: streaming
    timeout: 60
    retries: 1

  default_route: generate_ddl

  routes:
    - name: generate_ddl
      priority: 100
      condition:
        Always: true

      actions:
        # Generate DDL from SHACL shape
        - type: Transform
          transformer: shacl_ddl_generator
          config:
            dialect: "db2"
            include_indexes: true
            include_foreign_keys: true

        # Log the generated DDL
        - type: Log
          level: info
          message: "DDL generated successfully"

  monitoring:
    enabled: true
    quality_threshold: 0.95
