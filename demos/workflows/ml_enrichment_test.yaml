name: "ML Enrichment Workflow Tests"
workflow_file: "demos/workflows/ml_enrichment.yaml"

setup:
  - type: load_reference_data
    name: "customer_profiles"
    data:
      - customer_id: "CUST-001"
        segment: "premium"
        lifetime_value: 50000
      - customer_id: "CUST-002"
        segment: "standard"
        lifetime_value: 5000

  - type: set_env
    key: "TEST_MODE"
    value: "true"

test_cases:
  - name: "Customer enrichment with ML predictions"
    description: "Should enrich customer data with ML model predictions"
    input:
      customer_id: "CUST-001"
      age: 35
      income: 75000
      purchase_count: 42
    expect:
      route: "enrich"
      assertions:
        - type: field_exists
          field: "customer_id"
        - type: field_exists
          field: "age"
        - type: field_exists
          field: "income"

  - name: "Skip test example"
    skip: true
    skip_reason: "ML model not yet deployed in test environment"
    input:
      customer_id: "CUST-999"
    expect:
      route: "enrich"

teardown:
  - type: clear_reference_data
    name: "customer_profiles"

  - type: unset_env
    key: "TEST_MODE"
