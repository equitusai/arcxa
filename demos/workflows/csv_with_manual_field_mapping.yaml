# CSV-to-DB2 Workflow with Manual Field Mapping
#
# This workflow demonstrates human-in-the-loop field mapping with continuous learning.
# The field_mapper transformer applies manual corrections and learns from similar datasets.
#
# Workflow Flow:
#   1. Parse CSV from file library
#   2. Apply manual field mappings (with learning suggestions)
#   3. Apply ontology mapping (for unmapped fields)
#   4. Load to DB2 with proper schema
#
# Manual Mapping Example:
#   If a CSV has fields like "F1", "F2", "F3" (cryptic names), users can manually map:
#   - F1 → Customer.firstName
#   - F2 → Customer.lastName
#   - F3 → Customer.email
#
#   The system learns these mappings and suggests them for similar datasets in the future.

name: csv_manual_mapping_to_db2
description: CSV ingestion with manual field mapping and learning
version: "1.0"
enabled: true

# Workflow metadata
metadata:
  tags:
    - csv
    - manual-mapping
    - learning
    - db2
  author: graphica-system
  created_at: "2025-11-04T16:00:00Z"

# Input requirements
inputs:
  - name: file_id
    type: string
    required: true
    description: "File library ID for the CSV file"

  - name: source_table
    type: string
    required: true
    description: "Logical table name for the source data"

  - name: apply_suggestions
    type: boolean
    required: false
    default: true
    description: "Whether to apply learning-based field mapping suggestions"

  - name: min_suggestion_confidence
    type: number
    required: false
    default: 0.7
    description: "Minimum confidence threshold for suggestions (0.0-1.0)"

  - name: target_db2_table
    type: string
    required: true
    description: "Target DB2 table name"

  - name: db2_connection
    type: object
    required: true
    description: "DB2 connection details"

# Processing steps
steps:
  # Step 1: Parse CSV from file library
  - name: parse_csv
    transformer: csv_parse
    config:
      file_id: "${inputs.file_id}"
      delimiter: ","
      has_header: true
      skip_rows: 0
      max_rows: null

  # Step 2: Apply manual field mappings (HUMAN-IN-THE-LOOP)
  #
  # This step checks for:
  # 1. Exact manual mappings for this dataset
  # 2. Learning-based suggestions from similar datasets
  #
  # Priority: Manual > Suggested > Unmapped
  - name: map_fields_manually
    transformer: field_mapper
    config:
      dataset_id: "${inputs.file_id}"
      source_table: "${inputs.source_table}"
      apply_suggestions: "${inputs.apply_suggestions}"
      min_suggestion_confidence: "${inputs.min_suggestion_confidence}"
    on_success:
      log:
        message: "Applied ${field_mappings.count} field mappings"
        level: info
    on_failure:
      action: continue  # Non-fatal - continue with unmapped fields

  # Step 3: Apply ontology mapping for remaining unmapped fields
  #
  # This handles fields that weren't manually mapped or suggested.
  # Uses heuristics, ML models, and statistical matching.
  - name: map_ontology
    transformer: ontology_map
    config:
      ontology_namespace: "retail"
      confidence_threshold: 0.5
      use_ml_models: true
    on_success:
      log:
        message: "Mapped ${ontology_mappings.count} fields to ontology"
        level: info

  # Step 4: Load to DB2
  - name: load_to_db2
    transformer: db2_load
    config:
      connection: "${inputs.db2_connection}"
      target_table: "${inputs.target_db2_table}"
      mode: "insert"  # Options: insert, merge, truncate_and_load
      batch_size: 1000
      create_table_if_missing: true
      generate_ddl: true
    on_success:
      log:
        message: "Loaded ${rows_inserted} rows to DB2 table ${inputs.target_db2_table}"
        level: info
    on_failure:
      action: fail  # Fatal - workflow fails if DB2 load fails
      log:
        message: "Failed to load data to DB2: ${error}"
        level: error

# Output definition
outputs:
  - name: rows_processed
    description: "Total number of rows processed"
    value: "${steps.parse_csv.output.row_count}"

  - name: manual_mappings_applied
    description: "Number of manual field mappings applied"
    value: "${steps.map_fields_manually.output.field_mappings.count}"

  - name: suggested_mappings_applied
    description: "Number of suggested field mappings applied"
    value: "${steps.map_fields_manually.output.suggested_mappings.count}"

  - name: db2_rows_inserted
    description: "Number of rows successfully inserted into DB2"
    value: "${steps.load_to_db2.output.rows_inserted}"

  - name: field_mapping_details
    description: "Detailed field mapping information"
    value: "${steps.map_fields_manually.output.field_mappings}"

# Error handling
error_handling:
  retry_policy:
    max_retries: 3
    initial_delay_ms: 1000
    max_delay_ms: 10000
    backoff_multiplier: 2.0

  on_workflow_failure:
    action: log_and_alert
    log_level: error
    alert_channels:
      - slack
      - email

# Monitoring and observability
monitoring:
  collect_metrics: true
  metric_tags:
    workflow: csv_manual_mapping_to_db2
    environment: production

  metrics:
    - name: workflow_duration_ms
      type: histogram

    - name: manual_mappings_applied
      type: counter

    - name: suggested_mappings_accepted
      type: counter

    - name: rows_processed
      type: counter

# Example usage:
#
# To run this workflow:
#
# 1. First, upload CSV to file library:
#    POST /api/v1/file-library/files
#    Response: { "file_id": "file_12345" }
#
# 2. Execute workflow:
#    POST /api/v1/workflows/execute
#    {
#      "workflow_name": "csv_manual_mapping_to_db2",
#      "inputs": {
#        "file_id": "file_12345",
#        "source_table": "customers",
#        "apply_suggestions": true,
#        "min_suggestion_confidence": 0.75,
#        "target_db2_table": "STAGING.CUSTOMERS",
#        "db2_connection": {
#          "host": "db2-prod.example.com",
#          "port": 50000,
#          "database": "RETAIL",
#          "username": "etl_user",
#          "password": "${env.DB2_PASSWORD}"
#        }
#      }
#    }
#
# 3. To provide manual mappings (if needed):
#    POST /api/v1/mappings/manual
#    {
#      "source_context": {
#        "source_id": "file_12345",
#        "table_name": "customers",
#        "field_name": "F1"
#      },
#      "target_field_uri": "retail:customerFirstName",
#      "confidence": 1.0,
#      "created_by": "user@example.com",
#      "notes": "Manual correction - F1 is first name"
#    }
#
# 4. The system learns this mapping and will suggest it for similar datasets in future runs
