version: '3.3'

services:
  # PostgreSQL - CRM Database (CDC enabled for Graphica backend)
  crm-db:
    image: postgres:15-alpine
    container_name: graphica-demo-crm-db
    environment:
      POSTGRES_USER: graphica
      POSTGRES_PASSWORD: graphica_demo_2024
      POSTGRES_DB: postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5434:5432"
    volumes:
      - crm_data:/var/lib/postgresql/data
      - ./data/init-scripts/01-init-crm-db.sql:/docker-entrypoint-initdb.d/01-init-crm-db.sql
    networks:
      - graphica-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphica -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL - Transactions Database (CDC enabled for Graphica backend)
  transactions-db:
    image: postgres:15-alpine
    container_name: graphica-demo-transactions-db
    environment:
      POSTGRES_USER: graphica
      POSTGRES_PASSWORD: graphica_demo_2024
      POSTGRES_DB: postgres
    command:
      - "postgres"
      - "-c"
      - "wal_level=logical"
      - "-c"
      - "max_wal_senders=10"
      - "-c"
      - "max_replication_slots=10"
    ports:
      - "5433:5432"
    volumes:
      - transactions_data:/var/lib/postgresql/data
      - ./data/init-scripts/02-init-transactions-db.sql:/docker-entrypoint-initdb.d/02-init-transactions-db.sql
    networks:
      - graphica-demo
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U graphica -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Data Seeder - Generates and seeds demo data
  data-seeder:
    image: python:3.11-slim
    container_name: graphica-demo-data-seeder
    working_dir: /app
    environment:
      CRM_DB_HOST: crm-db
      CRM_DB_PORT: 5432
      TRANSACTIONS_DB_HOST: transactions-db
      TRANSACTIONS_DB_PORT: 5432
      POSTGRES_USER: graphica
      POSTGRES_PASSWORD: graphica_demo_2024
    volumes:
      - ./data:/app/data
      - ./data/init-scripts/03-seed-data.py:/app/seed_data.py
      - ./scripts/generate_demo_data.py:/app/generate_data.py
    networks:
      - graphica-demo
    depends_on:
      - crm-db
      - transactions-db
    command: >
      bash -c "
        echo 'Waiting for databases to be ready...' &&
        sleep 20 &&
        pip install --no-cache-dir psycopg2-binary pandas pyarrow &&
        python generate_data.py &&
        python seed_data.py &&
        echo 'Data seeding completed successfully!' &&
        tail -f /dev/null
      "

  # Streaming Data Generator - Continuous updates for live demo
  stream-generator:
    build:
      context: ./services/stream-generator
      dockerfile: Dockerfile
    container_name: graphica-demo-stream-generator
    depends_on:
      - crm-db
      - transactions-db
      - data-seeder
    environment:
      CRM_DB_HOST: crm-db
      CRM_DB_PORT: 5432
      TRANSACTIONS_DB_HOST: transactions-db
      TRANSACTIONS_DB_PORT: 5432
      POSTGRES_USER: graphica
      POSTGRES_PASSWORD: graphica_demo_2024
      STREAM_INTERVAL_SECONDS: 5
      UPDATES_PER_INTERVAL: 3
    networks:
      - graphica-demo
    restart: unless-stopped

  # Duplicate Detection ML Service
  duplicate-detector:
    build:
      context: ./services/duplicate-detector
      dockerfile: Dockerfile
    container_name: graphica-demo-duplicate-detector
    ports:
      - "8001:8001"
    networks:
      - graphica-demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Gender Prediction ML Service
  gender-predictor:
    build:
      context: ./services/gender-predictor
      dockerfile: Dockerfile
    container_name: graphica-demo-gender-predictor
    ports:
      - "8002:8002"
    networks:
      - graphica-demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

  # Address Validation Heuristics API
  address-validator:
    build:
      context: ./services/address-validator
      dockerfile: Dockerfile
    container_name: graphica-demo-address-validator
    ports:
      - "8003:8003"
    networks:
      - graphica-demo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped

volumes:
  crm_data:
  transactions_data:

networks:
  graphica-demo:
    driver: bridge
