[package]
name = "arcxa-cli"
version = "0.4.0"
edition = "2021"
authors = ["Equitus Corporation"]
license-file = "../LICENSE.md"
description = "Command-line tools for the ARCXA data governance platform"

[lib]
name = "graphica_cli"
path = "src/lib.rs"

[features]
default = ["migrate"]
migrate = ["dep:graphica-migrations", "dep:rocksdb"]

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"
required-features = ["migrate"]

[[bin]]
name = "admin"
path = "src/bin/admin.rs"

[dependencies]
graphica-migrations = { package = "arcxa-migrations", path = "../arcxa-migrations", optional = true }

# Core utilities
anyhow = "1.0"
thiserror = "1.0"

# CLI
clap = { version = "4.5", features = ["derive", "env"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Async runtime / HTTP
tokio = { workspace = true }
reqwest = { workspace = true }

# Storage (for migrate tool)
rocksdb = { workspace = true, optional = true }
