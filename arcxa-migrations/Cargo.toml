[package]
name = "arcxa-migrations"
version = "0.1.0"
edition = "2021"
authors = ["Equitus Corporation"]
license-file = "../LICENSE.md"
description = "Storage migration utilities for the ARCXA lineage database"

[lib]
name = "graphica_migrations"
path = "src/lib.rs"

[dependencies]
# Error handling
anyhow = "1.0"

# Storage
rocksdb = "0.22"

# Serialization (for old format deserialization only)
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"

[dev-dependencies]
tempfile = "3.0"
