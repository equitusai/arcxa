[package]
name = "arcxa-evidence-ingestion"
version = "0.1.0"
edition = "2021"
authors = ["Equitus Corporation"]
license-file = "../LICENSE.md"
description = "ARCXA migration evidence connector ingestion service"

[lib]
name = "arcxa_evidence_ingestion"
path = "src/lib.rs"

[[bin]]
name = "arcxa-evidence-ingestion"
path = "src/main.rs"

[dependencies]
graphica_core = { package = "arcxa-core", path = "../arcxa-core" }
arcxa-verification = { path = "../arcxa-verification" }
anyhow = "1.0"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
csv = "1.3"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tokio = { version = "1.36", features = ["full"] }
tonic = { version = "0.11", features = ["gzip"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
prost = "0.12"
rdkafka = { version = "0.36", features = ["cmake-build"] }
rocksdb = { workspace = true }

[dev-dependencies]
tempfile = "3.0"
