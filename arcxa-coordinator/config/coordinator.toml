# Graphica Coordinator Configuration
#
# This file contains all configuration options for the Graphica coordinator,
# including Kafka durability, storage, API, and observability settings.

[server]
# REST API port
rest_port = 8080

# gRPC API port
grpc_port = 9090

# Environment (development, staging, production)
environment = "production"

[storage]
# RocksDB path for hot tier (recent data)
rocksdb_path = "./data/coordinator/rocksdb"

# Parquet path for warm tier (historical data)
parquet_path = "./data/parquet"

# Archive path for cold tier (long-term storage)
archive_path = "./data/archive"

[storage.profiles]
# RocksDB performance profile
# Options: development, balanced, high_throughput, low_latency
profile = "high_throughput"

[storage.writer_pool]
# Number of writer threads for parallel writes
num_threads = 8

# Batch size for batched writes
batch_size = 100

# Batch timeout in milliseconds
batch_timeout_ms = 10

# Channel buffer size
channel_buffer = 10000

# ============================================================================
# KAFKA DURABILITY CONFIGURATION
# ============================================================================
# These settings control the WAL-backed Kafka producer that ensures zero
# data loss for lineage events.

[kafka]
# Enable durable Kafka sink (vs legacy fire-and-forget)
# IMPORTANT: Set to true for production to prevent data loss
durability_enabled = true

# Kafka broker addresses (comma-separated)
brokers = "localhost:9092"

# Kafka topic for lineage events
topic = "graphica.lineage"

[kafka.durability]
# Enable WAL-backed writes (recommended: true)
enabled = true

# Timeout for Kafka send operations (seconds)
send_timeout = 10

# Maximum retry attempts for failed sends
max_retries = 5

# Retry backoff duration (seconds)
retry_backoff = 2

[kafka.producer]
# Compression algorithm: none, gzip, snappy, lz4, zstd
# Production recommendation: lz4 (good balance of speed and compression)
compression = "lz4"

# Batch size in bytes (default: 65536 = 64KB)
# Larger batches improve throughput but increase latency
batch_size = 65536

# Linger time in milliseconds (how long to wait for more messages before sending)
# Higher values improve batching but increase latency
linger_ms = 5

# Request timeout in milliseconds
request_timeout_ms = 10000

# Maximum in-flight requests per connection
# Keep at 1 for strict ordering, higher for throughput
max_in_flight = 5

# Enable Kafka idempotence (exactly-once semantics)
# IMPORTANT: Must be true for zero data loss
enable_idempotence = true

# Acknowledgment level: "all", "1", "0"
# Production must use "all" for durability
acks = "all"

[kafka.acknowledgment_tracking]
# Maximum pending acknowledgments before applying backpressure
max_pending = 10000

# How long to retain acknowledgment history (seconds)
# Used for deduplication
ack_retention = 3600  # 1 hour

# Cleanup interval for old acknowledgments (seconds)
cleanup_interval = 300  # 5 minutes

[kafka.circuit_breaker]
# Number of consecutive failures before opening circuit
failure_threshold = 5

# Number of consecutive successes to close circuit
success_threshold = 3

# Timeout before transitioning from OPEN to HALF-OPEN (seconds)
timeout = 30

# Maximum concurrent requests allowed in HALF-OPEN state
half_open_max_calls = 3

[kafka.replay]
# Recovery mode: default, aggressive, conservative
# - default: 500 events/batch, 1s interval
# - aggressive: 1000 events/batch, 100ms interval (faster recovery)
# - conservative: 100 events/batch, 5s interval (lower load)
mode = "default"

# Batch size for recovery replay (overrides mode if set)
# batch_size = 500

# Interval between batches during recovery (milliseconds)
# batch_interval_ms = 1000

# Maximum retry attempts for failed batches
max_retry_attempts = 3

# Initial retry backoff (milliseconds)
retry_backoff_ms = 1000

# Maximum retry backoff (milliseconds)
max_backoff_ms = 60000

# ============================================================================
# KAFKA CONFIGURATION PRESETS
# ============================================================================
# Uncomment one of these sections to use a preset configuration

# [kafka.preset]
# # Use production preset (default)
# name = "production"

# [kafka.preset]
# # Use high-throughput preset (prioritize throughput over latency)
# name = "high_throughput"

# [kafka.preset]
# # Use low-latency preset (prioritize latency over throughput)
# name = "low_latency"

[shards]
# Shard URLs (comma-separated)
# Leave empty for standalone mode
urls = ""

# Number of shards
count = 2

# Shard replication factor
replication = 2

# Heartbeat timeout (seconds)
heartbeat_timeout = 60

[auth]
# Enable authentication
# Set to false for development, true for production
enabled = true

# JWT secret (base64-encoded)
# Generate with: openssl rand -base64 32
# jwt_secret = "your-secret-here"

[observability]
# Enable Prometheus metrics
metrics_enabled = true

# Metrics export port
metrics_port = 9091

# Enable distributed tracing
tracing_enabled = true

# Tracing export endpoint (Jaeger, Zipkin, etc.)
# tracing_endpoint = "http://localhost:14268/api/traces"

# Tracing sample rate (0.0 to 1.0)
tracing_sample_rate = 1.0

[observability.kafka]
# Enable Kafka-specific metrics
metrics_enabled = true

# Enable Kafka distributed tracing
tracing_enabled = true

# Log level for Kafka operations: error, warn, info, debug, trace
log_level = "info"

[workflow]
# Enable workflow execution
enabled = true

# Workflow execution database path
execution_db_path = "./data/workflow-executions-db"

# Enable checkpoint persistence
checkpoint_enabled = true

# Checkpoint interval (seconds)
checkpoint_interval = 30

# Enable workflow lineage tracking
lineage_enabled = true

# Streaming CDC configuration (optional)
# streaming_id = "workflow-123"
# cdc_brokers = "localhost:9092"
# cdc_topic = "dbserver1.public.customers"
# consumer_group = "graphica-workflow-123"

[file_library]
# File library storage path
db_path = "./data/file-library-db"

[ontology]
# Ontology registry storage path
db_path = "./data/ontologies"

# Enable automatic cache warming
cache_warming = true

# Cache TTL (seconds)
cache_ttl = 300  # 5 minutes

# Maximum cache entries
cache_max_entries = 1000

[mapping]
# Mapping engine storage path
db_path = "./data/mapping"

# Enable semantic matching (requires model service)
semantic_matching_enabled = false

# Model service URL for semantic matching
# model_service_url = "http://localhost:50051"

# Model service connection timeout (seconds)
model_service_connect_timeout = 5

# Model service request timeout (seconds)
model_service_request_timeout = 10

[loader]
# ETL loader configuration
max_concurrent_jobs = 10
batch_size = 1000
checkpoint_interval_rows = 10000
checkpoint_dir = "./data/loader/checkpoints"
dlq_dir = "./data/loader/dlq"

# ============================================================================
# ENVIRONMENT VARIABLE OVERRIDES
# ============================================================================
# All configuration values can be overridden with environment variables:
#
# - KAFKA_DURABILITY_ENABLED=true/false
# - KAFKA_BROKERS=kafka-1:9092,kafka-2:9092
# - KAFKA_PRODUCER_COMPRESSION=lz4
# - KAFKA_CIRCUIT_BREAKER_FAILURE_THRESHOLD=5
# - KAFKA_REPLAY_MODE=aggressive
# - REST_PORT=8080
# - GRPC_PORT=9090
# - ROCKSDB_PATH=./data/rocksdb
# - ENABLE_AUTH=true/false
# - JWT_SECRET=your-secret
#
# Environment variables take precedence over this configuration file.
