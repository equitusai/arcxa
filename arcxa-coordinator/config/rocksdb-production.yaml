# RocksDB Production Configuration for Workflow Storage
# Optimized for 10K+ executions/minute, 100GB+ storage

db_config:
  max_background_jobs: 16
  max_background_compactions: 8
  max_background_flushes: 4
  wal_dir: null  # Use same directory as data
  wal_ttl_seconds: 3600  # 1 hour
  wal_size_limit_mb: 4096  # 4GB
  stats_dump_period_sec: 600  # 10 minutes
  keep_log_file_num: 10
  max_log_file_size: 20971520  # 20MB
  enable_statistics: true

cf_configs:
  # Executions: Large JSON documents, frequent reads/writes
  executions:
    write_buffer_size: 134217728  # 128MB
    max_write_buffer_number: 4
    min_write_buffer_number_to_merge: 2
    compression: Lz4
    bottommost_compression: !Zstd 3
    block_size: 32768  # 32KB
    bloom_filter_bits_per_key: 10
    prefix_extractor: 16  # First 16 bytes
    target_file_size_base: 268435456  # 256MB
    target_file_size_multiplier: 2
    level0_file_num_compaction_trigger: 4
    level0_slowdown_writes_trigger: 20
    level0_stop_writes_trigger: 36

  # Events: Small, append-only, time-series
  events:
    write_buffer_size: 67108864  # 64MB
    max_write_buffer_number: 6
    min_write_buffer_number_to_merge: 3
    compression: Snappy
    bottommost_compression: !Zstd 3
    block_size: 16384  # 16KB
    bloom_filter_bits_per_key: 10
    prefix_extractor: 24  # execution_id:timestamp
    target_file_size_base: 134217728  # 128MB
    target_file_size_multiplier: 2
    level0_file_num_compaction_trigger: 8
    level0_slowdown_writes_trigger: 32
    level0_stop_writes_trigger: 64

  # Checkpoints: Infrequent writes, large documents
  checkpoints:
    write_buffer_size: 33554432  # 32MB
    max_write_buffer_number: 2
    min_write_buffer_number_to_merge: 1
    compression: !Zstd 6
    bottommost_compression: !Zstd 9
    block_size: 65536  # 64KB
    bloom_filter_bits_per_key: 10
    prefix_extractor: null
    target_file_size_base: 536870912  # 512MB
    target_file_size_multiplier: 1
    level0_file_num_compaction_trigger: 2
    level0_slowdown_writes_trigger: 8
    level0_stop_writes_trigger: 12

  # Metadata: Small, frequently accessed
  metadata:
    write_buffer_size: 16777216  # 16MB
    max_write_buffer_number: 3
    min_write_buffer_number_to_merge: 1
    compression: None
    bottommost_compression: Lz4
    block_size: 8192  # 8KB
    bloom_filter_bits_per_key: 10
    prefix_extractor: null
    target_file_size_base: 67108864  # 64MB
    target_file_size_multiplier: 1
    level0_file_num_compaction_trigger: 4
    level0_slowdown_writes_trigger: 12
    level0_stop_writes_trigger: 20

  # Progress tracking: small, frequent updates
  progress:
    write_buffer_size: 8388608  # 8MB
    max_write_buffer_number: 2
    min_write_buffer_number_to_merge: 1
    compression: Lz4
    bottommost_compression: Lz4
    block_size: 8192  # 8KB
    bloom_filter_bits_per_key: 10
    prefix_extractor: null
    target_file_size_base: 67108864  # 64MB
    target_file_size_multiplier: 1
    level0_file_num_compaction_trigger: 4
    level0_slowdown_writes_trigger: 12
    level0_stop_writes_trigger: 20

memory_config:
  total_memory_budget: 8589934592  # 8GB
  block_cache_size: 4294967296  # 4GB
  write_buffer_budget: 2147483648  # 2GB
  use_direct_reads: false
  use_direct_io_for_flush_and_compaction: false
  allow_mmap_reads: false
  cache_index_and_filter_blocks: true
  pin_l0_filter_and_index_blocks: true
  high_pri_pool_ratio: 0.5

compaction_config:
  style: Level
  max_bytes_for_level_base: 536870912  # 512MB
  max_bytes_for_level_multiplier: 10.0
  level_compaction_dynamic_level_bytes: true
  periodic_compaction_seconds: 2592000  # 30 days
  ttl_seconds: null

performance_config:
  max_subcompactions: 4
  optimize_filters_for_hits: true
  bytes_per_sync: 1048576  # 1MB
  wal_bytes_per_sync: 1048576  # 1MB
  rate_limiter_bytes_per_sec: 0  # Unlimited
  compaction_readahead_size: 2097152  # 2MB
  max_background_threads: 8
  enable_pipelined_write: true
  unordered_write: false

ttl_config:
  execution_ttl_seconds: 7776000  # 90 days
  event_ttl_seconds: 2592000  # 30 days
  checkpoint_ttl_seconds: 604800  # 7 days
  periodic_compaction_seconds: 86400  # Daily
