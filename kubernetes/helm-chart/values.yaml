global:
  storageClassName: ""
  imagePullPolicy: "Always"

openshiftMode:
  enabled: false

imageCredentials:
  registry: "registry.gitlab.com"
  username: ""
  password: ""

kafka:
  replicas: 3
  topicReplication: # Disable this if replicas are set to one.
    enabled: true
  version: 3.9.0
  storage:
    size: "50Gi"

graphica:
  serviceAccountName: arcxa
  ingress:
      uri: "graphica.apps.ocp4-dev.equitus.org"
      certName: ""

  coordinator:
    enabled: true
    replicas: 1
    imageTag: "registry.gitlab.com/equitus/fusion/graphica:master"
    cryptographicAudit: true
    secretStore:
      type: "file"
      directory: "/data/secrets"
      format: "json"
    storage:
      size: 10Gi
  shards:
    enabled: true
    replicas: 3
    imageTag: "registry.gitlab.com/equitus/fusion/graphica:master"
    storage:
      size: 100Gi
  modelService:
    enabled: true
    replicas: 1
    imageTag: "registry.gitlab.com/equitus/fusion/graphica:master"
  migrationEvidence:
    mode: "embedded"
    eventDeliveryMode: "direct"
    kafka:
      topic: "arcxa.migration-evidence.events.v1"
      consumerGroup: "arcxa-traceability"
    ingestion:
      enabled: false
      replicas: 1
      imageTag: "registry.gitlab.com/equitus/fusion/graphica:master"
      storage:
        size: 5Gi
    traceability:
      enabled: false
      replicas: 1
      imageTag: "registry.gitlab.com/equitus/fusion/graphica:master"
      signingKeyHex: "0101010101010101010101010101010101010101010101010101010101010101"
      storage:
        size: 20Gi
    verification:
      enabled: false
      replicas: 1
      imageTag: "registry.gitlab.com/equitus/fusion/graphica:master"
  frontend:
    enabled: true
    replicas: 1
    imageTag: "registry.gitlab.com/equitus/fusion/graphica-frontend:add-ci"
