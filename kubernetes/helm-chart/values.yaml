global:
  storageClassName: ""
  imagePullPolicy: "Always"

openshiftMode:
  enabled: false

imageCredentials:
  registry: "registry.gitlab.com"
  username: ""
  password: ""

kafka:
  replicas: 3
  topicReplication: # Disable this if replicas are set to one.
    enabled: true
  version: 3.9.0
  storage:
    size: "50Gi"

graphica:
  serviceAccountName: graphica
  ingress:
      uri: "graphica.apps.ocp4-dev.equitus.org"
      certName: ""

  coordinator:
    enabled: true
    replicas: 1
    imageTag: "registry.gitlab.com/equitus/fusion/graphica:master"
    cryptographicAudit: true
    secretStore:
      type: "file"
      directory: "/data/secrets"
      format: "json"
    storage:
      size: 10Gi
  shards:
    enabled: true
    replicas: 3
    imageTag: "registry.gitlab.com/equitus/fusion/graphica:master"
    storage:
      size: 100Gi
  modelService:
    enabled: true
    replicas: 1
    imageTag: "registry.gitlab.com/equitus/fusion/graphica:master"
  frontend:
    enabled: true
    replicas: 1
    imageTag: "registry.gitlab.com/equitus/fusion/graphica-frontend:add-ci"    
