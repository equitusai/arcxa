{{- if .Values.graphica.shards.enabled }}
kind: StatefulSet
apiVersion: apps/v1
metadata:
  name: arcxa-shard
  namespace: {{ .Release.namespace }}
spec:
  serviceName: arcxa-shard
  replicas: {{ .Values.graphica.shards.replicas }}
  selector:
    matchLabels:
      app: graphica
      component: shard
  template:
    metadata:
      labels:
        app: graphica
        component: shard
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/scrape: 'true'
    spec:
      serviceAccountName: {{ .Values.graphica.serviceAccountName }}
      imagePullSecrets:
        - name: arcxa-pull
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      containers:
        - name: arcxa-shard
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          volumeMounts:
            - name: arcxa-shard
              mountPath: /data
          image: {{ .Values.graphica.shards.imageTag }}
          args:
            - ./arcxa-shard
            - '--coordinator-url'
            - 'http://arcxa-coordinator:9090'
            - --data-path
            - /data/
            - --port
            - '9100'
      serviceAccount: {{ .Values.graphica.serviceAccountName }}
      volumes:
        - name: arcxa-shard
          persistentVolumeClaim:
            claimName: arcxa-shard
  volumeClaimTemplates:
    - metadata:
        name: arcxa-shard
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.graphica.shards.storage.size }}
        storageClassName: {{ .Values.global.storageClassName }}
        volumeMode: Filesystem
{{- end }}
