{{- if .Values.graphica.migrationEvidence.traceability.enabled -}}
apiVersion: v1
kind: Secret
metadata:
  name: arcxa-traceability-signing-key
  namespace: {{ .Release.namespace }}
type: Opaque
stringData:
  ARCXA_TRACEABILITY_SIGNING_KEY_HEX: {{ .Values.graphica.migrationEvidence.traceability.signingKeyHex | quote }}
{{- end }}
