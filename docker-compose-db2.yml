version: '3.3'

services:
  db2:
    image: icr.io/db2_community/db2:latest
    container_name: arcxa-db2
    privileged: true
    environment:
      - LICENSE=accept
      - DB2INSTANCE=db2inst1
      - DB2INST1_PASSWORD=graphica-db2-pass
      - DBNAME=GRAPHICA
      - ARCHIVE_LOGS=false
      - AUTOCONFIG=false
    ports:
      - "50000:50000"
    volumes:
      - db2-data:/database
    networks:
      - graphica-network

volumes:
  db2-data:
    driver: local

networks:
  graphica-network:
    driver: bridge
