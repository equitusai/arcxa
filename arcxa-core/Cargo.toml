[package]
name = "arcxa-core"
version = "0.2.0"
edition = "2021"
authors = ["Equitus Corporation"]
license-file = "../LICENSE.md"

[lib]
name = "graphica_core"
path = "src/lib.rs"

[features]
default = []
simd = []
power10-optimized = []
lambda = ["aws-config", "aws-sdk-lambda"]  # Enable AWS Lambda invocation
workflow-storage = ["rocksdb"]  # Enable RocksDB-backed workflow storage
odbc = ["dep:odbc-api"]  # Enable ODBC-backed connectors such as Oracle, DB2, and SAP HANA

[dependencies]
# Core utilities
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.36", features = ["full"] }
tonic = { version = "0.11", features = ["gzip"] }
prost = "0.12"
prost-types = "0.12"
uuid = { version = "1.7", features = ["v4", "serde"] }
sha2 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Streaming & Dataflow
timely = "0.12"
differential-dataflow = "0.12"

# Kafka & CDC
rdkafka = { version = "0.36", features = ["cmake-build"] }

# Columnar & Serialization
arrow2 = { version = "0.17", features = ["compute_concatenate", "io_parquet", "io_json"] }
parquet2 = "0.17"

# Performance
hashbrown = "0.14"
ahash = "0.8"
hyperloglog = "1.0"
quantiles = "0.7"

# Metrics
prometheus = "0.14.0"

# WASM Runtime
wasmtime = "17.0"

# Utilities
futures = "0.3"
regex = "1.10"
csv = "1.3"
tokio-stream = "0.1"
once_cell = "1.19"
lazy_static = "1.4"
flume = "0.11"  # Pure-Rust channels, works on all platforms including ppc64le
bytes = { version = "1.10.1", features = ["serde"] }
crc32fast = "1.5.0"
async-trait = "0.1.89"
dashmap = "6.1.0"
parking_lot = "0.12.4"
lru = "0.12"
bincode = "1.3"
bloomfilter = "1.0"
zstd = "0.13"
base64 = "0.21"
num_cpus = "1.16"
hostname = "0.4"
odbc-api = { version = "20.1", optional = true }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-postgres-rustls = "0.13"
rustls = "0.23"
rustls-native-certs = "0.8"
mysql_async = "0.33"
aws-sdk-s3 = "1.12"
aws-types = "1.1"
aws-credential-types = "1.2"

# OpenAPI documentation
utoipa = { version = "4.2", features = ["chrono", "uuid"] }

# Rule Orchestration
petgraph = "0.6"
serde_yaml = "0.9"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
quick-xml = "0.36"
statrs = "0.16"
rand = "0.8"

# RDF types (NO storage dependencies!)
rio_api = "0.8"
rio_turtle = "0.8"
rio_xml = "0.8"

# memmap2 for file mapping
memmap2 = "0.9"

# Machine Learning - REMOVED (TODO: Restore when ML dependencies are stable)
# fastembed, ort, tract-onnx, ndarray - removed to fix OpenSSL build issues
# Will be re-added to arcxa-model-service once stable

# AWS Lambda SDK (optional, enable with "lambda" feature)
aws-config = { version = "1.1", optional = true }
aws-sdk-lambda = { version = "1.12", optional = true }

# RocksDB for workflow storage (optional, enable with "workflow-storage" feature)
rocksdb = { version = "0.22", optional = true }

# CRITICAL: NO oxigraph in core
# oxigraph must only appear in shard crate
# rocksdb is now optionally available for workflow optimization

[build-dependencies]
tonic-build = "0.11"
prost-build = "0.12"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports", "async_tokio"] }
proptest = "1.4"
tempfile = "3.8"
tokio-test = "0.4"

[[bench]]
name = "workflow_runtime_bench"
harness = false
